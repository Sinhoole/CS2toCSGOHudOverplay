"OverplayHUD v.1"
{
  "uri"       "http://127.0.0.1:58880"
  "timeout"   "5.0"
  "buffer"    "0.05"
  "throttle"  "0.03"
  "heartbeat" "5.0"
  "auth"
  {
    "token" "OVERPLAYHUD"
  }
  "data"
  {
    "provider"           "1"   // 游戏名 / appid / 自己的 steamid
    "map"                "1"   // 地图、模式、阶段、双方比分
    "round"              "1"   // 回合阶段、炸弹状态、胜方
    "player_id"          "1"   // 名字、队名
    "player_state"       "1"   // 血量、护甲、头盔、金钱、本回合击杀
    "player_weapons"     "1"   // 持有武器与弹药
    "player_match_stats" "1"   // KDA / 得分 / MVP

    // ↓ 下面两项只在「观察者视角」下才有内容（自己死亡后的观战、GOTV、回放）。
    //   有内容时比本地推算更准，没有就自动退回推算，不影响存活时的表现。
    "phase_countdowns"   "1"   // 每个阶段的精确剩余秒数
    "bomb"               "1"   // C4 位置 / 携带者 / 是否已下包

    // ↓ allplayers 这一组 Valve 官方标注为「仅对 HLTV 与观察者有效」：
    //   你还活着的时候游戏不会下发队友数据（否则等于官方外挂），
    //   只有死亡观战 / GOTV / 回放时才会带上，用于「遍历场上队友」。
    //   开着它没有任何副作用 —— 拿不到数据时我们就什么都不显示。
    "allplayers_id"          "1"
    "allplayers_state"       "1"
    "allplayers_match_stats" "1"
    "allplayers_weapons"     "1"
  }
}
